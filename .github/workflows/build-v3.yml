name: Build maps-v3 (car-only)

# Builds a region's Valhalla tiles from an OSM extract with pedestrian and
# bicycle data excluded, then packs them into the maps-v3 corridor format.
#
# Why this exists alongside repack-v3.yml
# ---------------------------------------
#
# `repack-v3.yml` re-containers the existing maps-v2 tiles. It makes corridor
# downloads possible without touching tile content, and it is the fast path.
#
# This workflow *rebuilds* them, and the measurement says it is worth it.
# Measured on the real Swiss extract, comparing a default build against one with
# `--mjolnir-include-pedestrian false --mjolnir-include-bicycle false`:
#
#     level          full MB   car-only MB   saved
#     L0 highway        18.9          17.2      9%
#     L1 arterial       47.9          42.7     11%
#     L2 local         564.8         306.8     46%
#     TOTAL            631.5         366.7     42%
#
# Level 2 is where a corridor's bytes are, and it nearly halves. A 31.5 MB
# alpine corridor becomes roughly 18 MB on disk. The plan's decision rule was
# ">=25% saved ships car-only"; 42% clears it comfortably.
#
# The cost is real: this builds tiles from a PBF rather than copying them, so it
# is hours per region rather than minutes. Regions build serially because they
# share one release and one manifest.
#
# What is deliberately kept
# -------------------------
#
# Only pedestrian and bicycle *access* are dropped. Service roads, tracks and
# unclassified roads all stay: a rally route can legitimately run over a farm
# track or a car park approach, and the promise of the corridor plan is no
# compromise on roads anyone might actually drive. Valhalla's own switches are
# used rather than filtering the extract with osmium, because filtering by hand
# quietly drops the turn restrictions and admin boundaries that routing
# correctness depends on.

on:
  workflow_dispatch:
    inputs:
      builds:
        description: 'Space-separated build names from regions.v3.json, or "all"'
        required: true
        default: 'ch_full'
      publish:
        description: 'Upload to the maps-v3 release (otherwise artifacts only)'
        type: boolean
        required: true
        default: false

# Only one build run at a time. Each job publishes into the same release and
# merges the same manifest, and two runs racing that merge would delist
# whichever region lost.
concurrency:
  group: build-v3
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        # The extract each asset is built from, and the ids that resolve to it,
        # both come from regions.v3.json rather than being typed by hand.
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          spec = json.load(open('tools/valhalla-tiles/regions.v3.json'))['builds']
          wanted = "${{ inputs.builds }}".split()
          chosen = spec if wanted == ['all'] else [b for b in spec if b['build'] in wanted]
          unknown = set(wanted) - {b['build'] for b in spec} - {'all'}
          if unknown:
              raise SystemExit(f"unknown build(s): {sorted(unknown)}")
          # Every entry must carry the same keys: a matrix include whose key is
          # missing makes `matrix.bbox` null, and the step condition that reads
          # it then behaves differently from one that reads an empty string.
          for b in chosen:
              b.setdefault("bbox", "")
          print("matrix=" + json.dumps({"include": chosen}))
          PY

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    strategy:
      # Serial. Each job merges the shared manifest and uploads to one release;
      # in parallel they would clobber each other's manifest entries. Slower,
      # and the only way the result is correct.
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Free disk space
        # A large extract plus its tiles plus the packed output does not fit
        # alongside the runner's preinstalled toolchains.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Download the extract
        run: |
          set -euo pipefail
          curl -sL -o region.osm.pbf \
            "https://download.geofabrik.de/${{ matrix.geofabrik }}-latest.osm.pbf"
          ls -la region.osm.pbf

      - name: Cut the extract to its bounding box
        # Only for builds that declare one. Geofabrik ships the US south whole
        # and its tiles come to 2.37 GB, past GitHub's 2 GiB asset ceiling, so
        # it is split on the client's own boxes. --strategy complete_ways keeps
        # a road that leaves the box intact rather than truncating it mid-way,
        # which would leave routing walking off the end of a severed edge.
        if: ${{ matrix.bbox != '' }}
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y --no-install-recommends osmium-tool
          osmium extract --bbox "${{ matrix.bbox }}" --strategy complete_ways \
            -o cut.osm.pbf region.osm.pbf --overwrite
          mv cut.osm.pbf region.osm.pbf
          ls -la region.osm.pbf

      - name: Build car-only tiles
        run: |
          set -euo pipefail
          docker pull ghcr.io/valhalla/valhalla:latest
          mkdir -p out
          docker run --rm -v "$PWD:/w" -w /w ghcr.io/valhalla/valhalla:latest sh -c \
            "valhalla_build_config \
               --mjolnir-tile-dir /w/out/tiles \
               --mjolnir-include-pedestrian false \
               --mjolnir-include-bicycle false \
               > /w/out/valhalla.json && \
             valhalla_build_tiles -c /w/out/valhalla.json /w/region.osm.pbf"
          du -sh out/tiles

      - name: Pack to the maps-v3 format
        # repack_v3.py takes a zip, so the freshly built tree is zipped first.
        # Keeping one packer means the container format cannot drift between
        # the rebuild path and the repack path.
        run: |
          set -euo pipefail
          cd out/tiles && zip -qr ../../${{ matrix.build }}.vtiles.zip . && cd ../..
          mkdir -p packed
          python3 tools/valhalla-tiles/repack_v3.py \
            --region "${{ matrix.build }}" \
            --zip "${{ matrix.build }}.vtiles.zip" \
            --out packed
          ls -la packed

      - name: Refuse an asset GitHub will not accept
        # A release asset is capped at 2 GiB and the upload fails with an opaque
        # HTTP 422 after the whole build. Saying so here, with the number,
        # turns hours of wasted work into an obvious instruction to add a bbox
        # split for this region.
        run: |
          set -euo pipefail
          BYTES=$(stat -c%s "packed/${{ matrix.build }}.vtar")
          LIMIT=$((2 * 1024 * 1024 * 1024))
          echo "${{ matrix.build }}.vtar is $((BYTES / 1000000)) MB"
          if [ "$BYTES" -ge "$LIMIT" ]; then
            echo "::error::${{ matrix.build }}.vtar is $((BYTES / 1000000)) MB, over GitHub's 2 GiB asset limit. Split it with a bbox in tools/valhalla-tiles/regions.v3.json."
            exit 1
          fi

      - name: Rebuild the manifest from the release
        # regions-v3.json is the only discovery path: a vtar nobody can look up
        # is invisible to every client.
        #
        # Derived from the assets actually on the release, not merged onto a
        # previously downloaded copy. The merge version silently truncated: when
        # `gh release download` hiccupped it fell back to "publish this region
        # only" and --clobber then destroyed every other entry. That is exactly
        # what happened on the first full run -- 37 regions were published and
        # the manifest listed two. Reading the release back cannot lose regions
        # and repairs a manifest that has already been damaged.
        env:
          GH_TOKEN: ${{ github.token }}
          # Through the environment, not interpolated into the script: toJson
          # pretty-prints across several lines, which breaks a quoted literal
          # inside the heredoc and fails the step after the tiles are already
          # built -- an hour of work thrown away for a formatting detail.
          ASSET: ${{ matrix.build }}
          IDS: ${{ toJson(matrix.ids) }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          asset = os.environ["ASSET"]
          idx = json.loads(Path(f"packed/{asset}.idx.json").read_text())
          spec = json.load(open("tools/valhalla-tiles/regions.v3.json"))["builds"]
          ids_for = {b["build"]: b["ids"] for b in spec}

          # Every index on the release, plus the one about to be uploaded.
          listing = json.loads(subprocess.run(
              ["gh", "release", "view", "maps-v3", "--json", "assets"],
              check=True, capture_output=True, text=True,
          ).stdout)["assets"]
          sizes = {a["name"]: a["size"] for a in listing}

          Path("_idx").mkdir(exist_ok=True)
          published = {}
          for name in [a["name"] for a in listing if a["name"].endswith(".idx.json")]:
              build_name = name[: -len(".idx.json")]
              if build_name == asset:
                  published[build_name] = idx
                  continue
              # An index whose vtar is absent describes nothing fetchable -- the
              # 2 GiB asset limit leaves exactly that behind when an upload is
              # rejected. Skipping it keeps the manifest honest.
              if f"{build_name}.vtar" not in sizes:
                  print(f"skipping {build_name}: no vtar on the release")
                  continue
              subprocess.run(
                  ["gh", "release", "download", "maps-v3", "-p", name, "-D", "_idx", "--clobber"],
                  check=True, capture_output=True,
              )
              published[build_name] = json.loads(Path("_idx", name).read_text())

          regions = []
          for build_name, doc in published.items():
              for rid in ids_for.get(build_name, [build_name]):
                  regions.append({
                      "id": rid,
                      "build": doc["build"],
                      "vtar": f"{build_name}.vtar",
                      "idx": f"{build_name}.idx.json",
                      "tileCount": doc["tileCount"],
                      "vtarBytes": doc["vtarBytes"],
                  })

          out = {"build": idx["build"], "regions": sorted(regions, key=lambda r: r["id"])}
          Path("packed/regions-v3.json").write_text(json.dumps(out, indent=2, sort_keys=True))
          print(f"manifest lists {len(regions)} region id(s) from {len(published)} asset(s)")
          PY

      - name: Upload artifacts
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: maps-v3-${{ matrix.build }}
          path: packed/
          retention-days: 7

      - name: Publish to the maps-v3 release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view maps-v3 >/dev/null 2>&1 || \
            gh release create maps-v3 --title "Valhalla tiles v3 (corridor format, car-only)" \
              --notes "Per-tile addressable regions, built without pedestrian or bicycle data. See tools/valhalla-tiles/repack_v3.py."
          # --clobber so re-running one region replaces just that region's
          # assets, and the merged manifest replaces the previous one.
          gh release upload maps-v3 \
            "packed/${{ matrix.build }}.vtar" \
            "packed/${{ matrix.build }}.idx.json" \
            "packed/regions-v3.json" --clobber
