name: Build maps-v3 (car-only)

# Builds a region's Valhalla tiles from an OSM extract with pedestrian and
# bicycle data excluded, then packs them into the maps-v3 corridor format.
#
# Why this exists alongside repack-v3.yml
# ---------------------------------------
#
# `repack-v3.yml` re-containers the existing maps-v2 tiles. It makes corridor
# downloads possible without touching tile content, and it is the fast path.
#
# This workflow *rebuilds* them, and the measurement says it is worth it.
# Measured on the real Swiss extract, comparing a default build against one with
# `--mjolnir-include-pedestrian false --mjolnir-include-bicycle false`:
#
#     level          full MB   car-only MB   saved
#     L0 highway        18.9          17.2      9%
#     L1 arterial       47.9          42.7     11%
#     L2 local         564.8         306.8     46%
#     TOTAL            631.5         366.7     42%
#
# Level 2 is where a corridor's bytes are, and it nearly halves. A 31.5 MB
# alpine corridor becomes roughly 18 MB on disk. The plan's decision rule was
# ">=25% saved ships car-only"; 42% clears it comfortably.
#
# The cost is real: this builds tiles from a PBF rather than copying them, so it
# is hours per region rather than minutes. Regions build serially because they
# share one release and one manifest.
#
# What is deliberately kept
# -------------------------
#
# Only pedestrian and bicycle *access* are dropped. Service roads, tracks and
# unclassified roads all stay: a rally route can legitimately run over a farm
# track or a car park approach, and the promise of the corridor plan is no
# compromise on roads anyone might actually drive. Valhalla's own switches are
# used rather than filtering the extract with osmium, because filtering by hand
# quietly drops the turn restrictions and admin boundaries that routing
# correctness depends on.

on:
  workflow_dispatch:
    inputs:
      builds:
        description: 'Space-separated build names from regions.v3.json, or "all"'
        required: true
        default: 'ch_full'
      publish:
        description: 'Upload to the maps-v3 release (otherwise artifacts only)'
        type: boolean
        required: true
        default: false

# Only one build run at a time. Each job publishes into the same release and
# merges the same manifest, and two runs racing that merge would delist
# whichever region lost.
concurrency:
  group: build-v3
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        # The extract each asset is built from, and the ids that resolve to it,
        # both come from regions.v3.json rather than being typed by hand.
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          spec = json.load(open('tools/valhalla-tiles/regions.v3.json'))['builds']
          wanted = "${{ inputs.builds }}".split()
          chosen = spec if wanted == ['all'] else [b for b in spec if b['build'] in wanted]
          unknown = set(wanted) - {b['build'] for b in spec} - {'all'}
          if unknown:
              raise SystemExit(f"unknown build(s): {sorted(unknown)}")
          print("matrix=" + json.dumps({"include": chosen}))
          PY

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    strategy:
      # Serial. Each job merges the shared manifest and uploads to one release;
      # in parallel they would clobber each other's manifest entries. Slower,
      # and the only way the result is correct.
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Free disk space
        # A large extract plus its tiles plus the packed output does not fit
        # alongside the runner's preinstalled toolchains.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Download the extract
        run: |
          set -euo pipefail
          curl -sL -o region.osm.pbf \
            "https://download.geofabrik.de/${{ matrix.geofabrik }}-latest.osm.pbf"
          ls -la region.osm.pbf

      - name: Build car-only tiles
        run: |
          set -euo pipefail
          docker pull ghcr.io/valhalla/valhalla:latest
          mkdir -p out
          docker run --rm -v "$PWD:/w" -w /w ghcr.io/valhalla/valhalla:latest sh -c \
            "valhalla_build_config \
               --mjolnir-tile-dir /w/out/tiles \
               --mjolnir-include-pedestrian false \
               --mjolnir-include-bicycle false \
               > /w/out/valhalla.json && \
             valhalla_build_tiles -c /w/out/valhalla.json /w/region.osm.pbf"
          du -sh out/tiles

      - name: Pack to the maps-v3 format
        # repack_v3.py takes a zip, so the freshly built tree is zipped first.
        # Keeping one packer means the container format cannot drift between
        # the rebuild path and the repack path.
        run: |
          set -euo pipefail
          cd out/tiles && zip -qr ../../${{ matrix.build }}.vtiles.zip . && cd ../..
          mkdir -p packed
          python3 tools/valhalla-tiles/repack_v3.py \
            --region "${{ matrix.build }}" \
            --zip "${{ matrix.build }}.vtiles.zip" \
            --out packed
          ls -la packed

      - name: Merge the manifest
        # Without this the region is published and no client can find it:
        # regions-v3.json is the only discovery path, and a vtar nobody can
        # look up is invisible. Merged rather than written, so building one
        # region does not delist every other.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          asset = "${{ matrix.build }}"
          ids = json.loads('${{ toJson(matrix.ids) }}')
          idx = json.loads(Path(f"packed/{asset}.idx.json").read_text())
          # One entry per client-requestable id, all pointing at this asset.
          # The client splits the US south by bounding box while Geofabrik ships
          # it as one extract; two ids sharing a vtar costs nothing and beats
          # building the same tiles twice.
          merged = {
              rid: {
                  "id": rid,
                  "build": idx["build"],
                  "vtar": f"{asset}.vtar",
                  "idx": f"{asset}.idx.json",
                  "tileCount": idx["tileCount"],
                  "vtarBytes": idx["vtarBytes"],
              }
              for rid in ids
          }
          try:
              subprocess.run(
                  ["gh", "release", "download", "maps-v3", "-p", "regions-v3.json", "-D", "_prev"],
                  check=True, capture_output=True,
              )
              prev = json.loads(Path("_prev/regions-v3.json").read_text())
              for r in prev["regions"]:
                  merged.setdefault(r["id"], r)
              print(f"merged {len(prev['regions'])} previously published region(s)")
          except subprocess.CalledProcessError:
              print("no previous manifest; publishing this region only")
          out = {"build": idx["build"], "regions": [merged[k] for k in sorted(merged)]}
          Path("packed/regions-v3.json").write_text(json.dumps(out, indent=2, sort_keys=True))
          print(f"manifest now lists {len(out['regions'])} region(s)")
          PY

      - name: Upload artifacts
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: maps-v3-${{ matrix.build }}
          path: packed/
          retention-days: 7

      - name: Publish to the maps-v3 release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view maps-v3 >/dev/null 2>&1 || \
            gh release create maps-v3 --title "Valhalla tiles v3 (corridor format, car-only)" \
              --notes "Per-tile addressable regions, built without pedestrian or bicycle data. See tools/valhalla-tiles/repack_v3.py."
          # --clobber so re-running one region replaces just that region's
          # assets, and the merged manifest replaces the previous one.
          gh release upload maps-v3 \
            "packed/${{ matrix.build }}.vtar" \
            "packed/${{ matrix.build }}.idx.json" \
            "packed/regions-v3.json" --clobber
